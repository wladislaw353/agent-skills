interface:
  display_name: "Adaptive Interfaces"
  short_description: "Adapt websites and apps to windows, folds and input"
  default_prompt: "Use $adaptive-interfaces to adapt existing tasks to current window geometry, posture, keyboard, and accessibility preferences. In Flip or landscape Fold tabletop, keep bottom sheets and their animations in the lower region while preserving task state."
